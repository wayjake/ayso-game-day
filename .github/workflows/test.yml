name: Unit tests

# Money rules (rounding, splits, the ledger's double entry) must never break
# quietly. The tested modules are pure TypeScript with no npm imports, so Node
# runs them directly (type stripping) without installing anything.
on:
  pull_request:
  push:
    branches: [preview, main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - run: npm test
